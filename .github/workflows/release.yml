name: Build & Release APK

# Releases are published ONLY from version tags (vX.Y.Z), and the APKs are built from exactly
# the tagged commit, so a rebuild of the same tag (e.g. by F-Droid) matches the published APKs.
#
# Branch pushes and pull requests only verify: version files, unit tests and a release build.
on:
  push:
    branches:
      - main
      - tmp
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Toolchain for the bundled rclone binary (scripts/build-rclone.sh). Changing either one
  # changes the binary, so both are part of the cache key below.
  GO_VERSION: '1.26'
  NDK_VERSION: '27.2.12479018' # r27c

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Same as F-Droid's build server (OpenJDK 21): javac 17 and 21 emit slightly different
      # bytecode and R8 then shrinks it differently. The app still targets Java 17.
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🔎 Read rclone Version
        id: rclone
        run: |
          version="$(sed -n 's/^require github.com\/rclone\/rclone \(v[^ ]*\).*/\1/p' rclone-android/go.mod)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rclone $version"

      - name: 🗃️ Cache rclone Binaries
        id: rclone_cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/.rclone
          key: rclone-${{ steps.rclone.outputs.version }}-go${{ env.GO_VERSION }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-rclone.sh', 'rclone-android/main.go', 'rclone-android/go.mod', 'rclone-android/go.sum') }}

      - name: 🐹 Set up Go
        if: steps.rclone_cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 🧱 Install Android NDK
        if: steps.rclone_cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: ⚙️ Build rclone for Android
        if: steps.rclone_cache.outputs.cache-hit != 'true'
        run: bash scripts/build-rclone.sh

      - name: 🔑 Set up Keystore
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import base64, os, re, sys
          raw = os.environ.get('KEYSTORE_BASE64', '').strip()
          if raw:
              cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              missing_padding = len(cleaned) % 4
              if missing_padding:
                  cleaned += '=' * (4 - missing_padding)
              try:
                  decoded = base64.b64decode(cleaned)
                  if len(decoded) > 0:
                      with open('app/release.jks', 'wb') as f:
                          f.write(decoded)
                      print(f'Keystore decoded successfully ({len(decoded)} bytes)')
              except Exception as e:
                  print(f'::warning::Failed to decode keystore: {e}', file=sys.stderr)
          else:
              print('No RELEASE_KEYSTORE_BASE64 provided; building unsigned APKs.')
          "

      - name: 🔧 Grant Execute Permissions for Gradlew
        run: chmod +x gradlew

      - name: 🔢 Verify versionCode, versionName & Fastlane Changelog
        id: version
        run: python3 .github/scripts/update_version.py --check

      - name: 🏷️ Verify Tag Matches CHANGELOG.md
        if: env.IS_RELEASE == 'true'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          changelog_version="$(grep -m1 -oP '^##\s*\[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)"
          if [ "$tag_version" != "$changelog_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the newest CHANGELOG.md version ($changelog_version). Tag the commit that contains the release."
            exit 1
          fi
          echo "Releasing $GITHUB_REF_NAME from commit $GITHUB_SHA"

      - name: 🏷️ Generate Release Notes
        id: release_info
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/generate_release_notes.py

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: 📦 Build Optimized Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: 📂 Prepare Release Artifacts
        if: env.IS_RELEASE == 'true'
        env:
          TAG: ${{ steps.release_info.outputs.tag_name }}
        run: |
          mkdir -p artifacts
          out=app/build/outputs/apk/release
          shopt -s nullglob
          signed=("$out"/app-*-release.apk)
          if [ ${#signed[@]} -eq 0 ]; then
            echo "::error::No signed APKs: set the RELEASE_KEYSTORE_BASE64 secret (unsigned builds are only for F-Droid)."
            exit 1
          fi
          for apk in "${signed[@]}"; do
            abi="$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')"
            cp "$apk" "artifacts/GoogleDriveSync-$TAG-$abi.apk"
          done
          cp "$out/app-universal-release.apk" artifacts/GoogleDriveSync-latest.apk
          ls -l artifacts

      - name: 📤 Upload Build Artifacts
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GoogleDriveSync-APK
          path: artifacts/*.apk

      - name: 🚀 Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # The release belongs to the tag that triggered this run; never to a branch head.
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          body_path: release_body.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Generate Tabular Build Summary
        if: always()
        env:
          RCLONE_VERSION: ${{ steps.rclone.outputs.version }}
        run: python3 .github/scripts/generate_summary.py
